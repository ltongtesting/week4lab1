name: Java CI Pipelines

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, sonarqube]

    steps:
      - name: Extract Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize Java Development Kit 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, Resolve Dependencies, and Execute JUnit Tests
        working-directory: ./invalid-folder
        run: mvn clean package

      - name: Compute Code Coverage Metrics
        run: mvn jacoco:report
